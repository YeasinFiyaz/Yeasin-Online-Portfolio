[build]
  publish = "my-portfolio"
  functions = "netlify/functions"

[dev]
  publish = "my-portfolio"
  port = 8888

# The editor must never be cached or indexed
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
