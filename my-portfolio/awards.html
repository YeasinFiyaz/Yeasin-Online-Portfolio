<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awards | Yeasin Fiyaz</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top nav-blur">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./index.html">Yeasin Fiyaz</a>

      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="./index.html">Back</a>
        <a class="btn btn-sm btn-accent" href="./projects.html">Projects</a>
      </div>
    </div>
  </nav>

  <section class="section" style="padding-top:110px">
    <div class="container">
      <div class="section-head">
        <p class="section-kicker">Achievements</p>
        <h2 class="section-title">Awards & Activities</h2>
        <p class="section-subtitle">Edit awards from <b>data/awards.json</b></p>
      </div>

      <div id="awardsList" class="row g-4"></div>
    </div>
  </section>

  <script>
    async function loadAwards() {
      const res = await fetch("./data/awards.json");
      const awards = await res.json();
      const wrap = document.getElementById("awardsList");

      wrap.innerHTML = awards.map(a => `
        <div class="col-lg-6">
          <div class="cardx">
            <h5 class="mini-title">${a.title}</h5>
            <div class="mini-text">${a.org ? a.org + " • " : ""}${a.period}</div>
            ${a.note ? `<p class="mini-text mt-2">${a.note}</p>` : ""}
          </div>
        </div>
      `).join("");
    }
    loadAwards();
  </script>
</body>
</html>
