<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Yeasin Fiyaz</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top nav-blur">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./index.html">Yeasin Fiyaz</a>

      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="./index.html#projects">Back</a>
        <a class="btn btn-sm btn-accent" href="./awards.html">Awards</a>
      </div>
    </div>
  </nav>

  <section class="section" style="padding-top:110px">
    <div class="container">
      <div class="section-head">
        <p class="section-kicker">Portfolio</p>
        <h2 class="section-title">All Projects</h2>
        <p class="section-subtitle">Edit projects from <b>data/projects.json</b></p>
      </div>

      <div id="allProjects" class="row g-4"></div>
    </div>
  </section>

  <script>
    async function loadAll() {
      const res = await fetch("./data/projects.json");
      const projects = await res.json();
      const wrap = document.getElementById("allProjects");

      wrap.innerHTML = projects.map(p => `
        <div class="col-md-6 col-lg-4">
          <div class="project-card">
            <img class="project-img" src="${p.image}" alt="${p.title}">
            <div class="project-body">
              <h5 class="project-title">${p.title}</h5>
              <div class="mini-text">${p.period}</div>
              <p class="mini-text mt-2">${p.short}</p>

              <div class="project-tags mt-2">
                ${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}
              </div>

              <div class="mt-3 d-flex gap-2 flex-wrap">
                ${p.github ? `<a class="btn btn-sm btn-outline-light" href="${p.github}" target="_blank">GitHub</a>` : ""}
                ${p.demo ? `<a class="btn btn-sm btn-accent" href="${p.demo}" target="_blank">Live</a>` : ""}
              </div>
            </div>
          </div>
        </div>
      `).join("");
    }
    loadAll();
  </script>
</body>
</html>
